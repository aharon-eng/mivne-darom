<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#0a3733 0%,#12524b 55%,#1c655e 100%);font-family:"Segoe UI","Heebo",Arial,sans-serif;position:relative;overflow:hidden}
  body::after{content:"";position:absolute;inset:-40%;background:
    radial-gradient(circle at 30% 20%, rgba(185,154,91,.12), transparent 40%),
    radial-gradient(circle at 75% 80%, rgba(255,255,255,.06), transparent 45%)}
  .box{position:relative;z-index:2;background:#fff;border-radius:22px;padding:42px 44px;max-width:400px;width:90%;
    text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.4)}
  .box img{width:220px;max-width:78%;margin-bottom:4px}
  h1{font-size:15px;margin:0 0 2px;color:#0f4a44;font-weight:600}
  p{color:#6b7d7a;font-size:12.5px;margin:0 0 22px}
  input{width:100%;box-sizing:border-box;border:1.5px solid #e3e0d8;background:#fff;color:#1d2b29;
    border-radius:12px;padding:13px 14px;font-size:18px;text-align:center;font-family:inherit;direction:ltr;letter-spacing:6px}
  input:focus{outline:none;border-color:#1c655e;box-shadow:0 0 0 3px rgba(28,101,94,.13)}
  button{width:100%;margin-top:13px;background:#0f4a44;color:#fff;border:none;
    border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
  button:hover{background:#1c655e}
  button:disabled{opacity:.6;cursor:wait}
  #err{color:#b3403a;font-size:13px;margin-top:10px;min-height:18px}
  #err.ok{color:#1c655e}
  .foot{margin-top:16px;font-size:11px;color:#6b7d7a}
</style>

  <h1>מערכת ניהול ושיווק — כנרא</h1>
  <p>שכונת המושבה טבריה · אדני ארץ | א.ש.מ שיכון ויזמות · גישה מורשית בלבד</p>
  <form id="f">
    <input type="password" id="pw" inputmode="numeric" placeholder="••••" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">כניסה למערכת</button>
  </form>
  <div id="err"></div>
  <div class="foot">התוכן מוצפן (AES-256) · ההרשאה נקבעת לפי הסיסמה · *2379</div>
</div>
<script>
const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryDecrypt(blob,pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b2a(blob.salt),iterations:150000,hash:"SHA-256"},km,256);
  const key=await crypto.subtle.importKey("raw",bits,{name:"AES-CBC"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-CBC",iv:b2a(blob.iv)},key,b2a(blob.ct));
  return new TextDecoder().decode(plain);
}
const cache={};
async function getBlob(name){
  if(cache[name])return cache[name];
  const r=await fetch(name+".json?v="+Date.now().toString(36).slice(0,6),{cache:"no-store"});
  if(!r.ok)throw new Error("fetch "+name);
  cache[name]=await r.json();return cache[name];
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err"),btn=document.getElementById("btn");
  const pw=document.getElementById("pw").value.trim();
  if(!pw)return;
  btn.disabled=true;err.className="ok";err.textContent="טוען ומפענח…";
  for(const name of["a","m"]){
    try{
      const html=await tryDecrypt(await getBlob(name),pw);
      document.open();document.write(html);document.close();return;
    }catch(ex){}
  }
  err.className="";err.textContent="סיסמה שגויה — נסה שוב";btn.disabled=false;
});
</script>
