const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err");
  err.textContent="פותח…";
  try{
    const pw=document.getElementById("pw").value;
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b2a(SALT),iterations:150000,hash:"SHA-256"},km,256);
    const key=await crypto.subtle.importKey("raw",bits,{name:"AES-CBC"},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-CBC",iv:b2a(IV)},key,b2a(CT));
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(ex){
    err.textContent="סיסמה שגויה — נסה שוב";
  }
});
